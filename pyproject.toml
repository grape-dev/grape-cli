[project]
name = "grape"
version = "0.2.9"
description = "Agentic DevOps CLI：契约驱动命令生成 + git 本地传输（token 零暴露）"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
grape = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]